<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitalma</title>
<style>
  :root{
    --green:#4a7a4a;
    --cream:#f5edd8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .brandmark{
    width:min(420px,60vw);
    aspect-ratio:1118.84/597.44;
    background-color:var(--cream);
    -webkit-mask:url('brandmark.svg') center/contain no-repeat;
    mask:url('brandmark.svg') center/contain no-repeat;
  }
</style>
</head>
<body>
  <span class="brandmark"></span>
</body>
</html>
