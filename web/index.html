<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitalma — vizuální identita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#4a7a4a;
    --green-deep:#2c4f2c;
    --cream:#f5edd8;
    --ink-soft:#4d614d;
    --serif:'Marcellus',Georgia,serif;
    --sans:'Outfit',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--cream);font-family:var(--sans);color:var(--green-deep)}

  /* ===== full-height panels (plain normal flow) ===== */
  .panel{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
  .panel.green{background:var(--green)}
  .panel.cream{background:var(--cream)}

  .wmark{width:min(720px,88vw);height:auto;overflow:visible;display:block}
  .green .wmark path,.green .wmark rect,.green .wmark circle{fill:var(--cream)}
  .cream .wmark path,.cream .wmark rect,.cream .wmark circle{fill:var(--green)}

  /* intro animation (hero only) */
  #bmV,#bmA{ transform-origin:0 0; }
  #bmV{ transform:matrix(0.42,0,0,0.42,155.04,-82.46); }
  #bmA{ transform:matrix(0.42,0,0,0.42,155.04,-82.46); }
  #bmLayer{ opacity:1; }
  #loVA{ opacity:0; }
  #loMid{ opacity:0; }
  #bmV,#bmA{ transition:transform 1.6s cubic-bezier(.66,0,.2,1) .6s; }
  #bmLayer{ transition:opacity .5s ease 2.05s; }
  #loVA{ transition:opacity .5s ease 2.05s; }
  #loMid{ transition:opacity .85s ease 1.3s; }
  #intro.go #bmV{ transform:matrix(0.1443,0,0,0.1443,0,0); }
  #intro.go #bmA{ transform:matrix(0.1443,0,0,0.1443,618.657,0); }
  #intro.go #bmLayer{ opacity:0; }
  #intro.go #loVA{ opacity:1; }
  #intro.go #loMid{ opacity:1; }

  .cue{position:absolute;bottom:28px;left:0;right:0;text-align:center;
    color:var(--cream);font:300 12px/1 var(--sans);letter-spacing:.24em;
    text-transform:uppercase;opacity:.55;pointer-events:none}
  .cue .arrow{display:block;font-size:18px;margin-top:8px;animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  /* ===== content section ===== */
  .sec{background:var(--cream);padding:clamp(70px,10vh,120px) 0}
  .wrap{max-width:1200px;margin:0 auto;padding:0 32px}
  .sec-head{display:flex;align-items:center;gap:12px;font-weight:400;letter-spacing:.28em;
    text-transform:uppercase;font-size:13px;color:var(--ink-soft);margin-bottom:22px}
  .sec-head .num{font-family:var(--serif);font-size:15px}
  .sec-head .line{height:1px;flex:1;max-width:70px;background:currentColor;opacity:.3}
  h2.title{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,54px);
    line-height:1.12;color:var(--green-deep);margin-bottom:18px}
  .lead{font-weight:300;font-size:clamp(17px,2.2vw,21px);max-width:62ch;color:var(--ink-soft);margin-bottom:44px}

  .compare{position:relative;width:100%;aspect-ratio:1582/994;border-radius:16px;overflow:hidden;
    cursor:ew-resize;user-select:none;box-shadow:0 30px 60px rgba(0,0,0,.18);background:#243524}
  .compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    pointer-events:none;-webkit-user-drag:none}
  .compare .top{clip-path:inset(0 50% 0 0)}
  .compare .divider{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--cream);
    box-shadow:0 0 0 1px rgba(0,0,0,.12);pointer-events:none}
  .compare .knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:50px;height:50px;border-radius:50%;background:var(--cream);color:var(--green);
    display:flex;align-items:center;justify-content:center;font-size:16px;letter-spacing:-1px;
    box-shadow:0 6px 18px rgba(0,0,0,.28)}
  .tag{position:absolute;bottom:18px;font-weight:400;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:#fff;background:rgba(20,30,20,.34);padding:7px 13px;
    border-radius:30px;pointer-events:none}
  .tag-l{left:18px}.tag-r{right:18px}
  .hint-sm{margin-top:16px;font-size:13px;color:var(--ink-soft);opacity:.8;font-weight:300}
</style>
</head>
<body>

 <!-- 3) LOGO IN CONTEXT: before/after slider -->
 <section class="sec">
  <div class="wrap">
   <div class="sec-head"><span class="num">01</span> Logo v prostředí <span class="line"></span></div>
   <h2 class="title">Stylové i v reálu.</h2>
   <p class="lead">Logo funguje na světlém i tmavém podkladu — v jemné krémové verzi na fotografii i v sytě zelené. Přejeďte myší a porovnejte obě varianty nasazení.</p>

   <div class="compare" id="cmp">
    <img class="base" src="logo_2.jpg" alt="Světlá varianta — zelené logo">
    <img class="top"  src="logo_1.jpg" alt="Tmavá varianta — krémové logo">
    <div class="divider"><span class="knob">‹ ›</span></div>
    <span class="tag tag-l">Tmavá varianta</span>
    <span class="tag tag-r">Světlá varianta</span>
   </div>
   <p class="hint-sm">↔ Přejeďte myší přes obrázek pro porovnání variant</p>
  </div>
 </section>

<script>
  /* intro animation */
  var introMark=document.getElementById('intro');
  setTimeout(function(){ introMark.classList.add('go'); },650);

  /* before / after comparison slider (follows the cursor) */
  var cmp=document.getElementById('cmp');
  if(cmp){
    var top=cmp.querySelector('.top'), divider=cmp.querySelector('.divider');
    function setSplit(x){ x=Math.max(0,Math.min(100,x));
      top.style.clipPath='inset(0 '+(100-x).toFixed(2)+'% 0 0)';
      divider.style.left=x.toFixed(2)+'%'; }
    function posX(e){ var r=cmp.getBoundingClientRect();
      var cx=(e.touches&&e.touches[0])?e.touches[0].clientX:e.clientX;
      return (cx-r.left)/r.width*100; }
    cmp.addEventListener('mousemove',function(e){ setSplit(posX(e)); });
    cmp.addEventListener('touchmove',function(e){ setSplit(posX(e)); },{passive:true});
    setSplit(50);
  }
</script>
