<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitalma</title>
<style>
  :root{
    --green:#4a7a4a;
    --cream:#f5edd8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    cursor:pointer;
    overflow:hidden;
  }

  #mark{
    width:min(640px,84vw);
    height:auto;
    overflow:visible;
    display:block;
  }
  #mark g, #mark path, #mark rect, #mark circle{ fill:var(--cream); }

  /* groups that animate — origin = their own bounding-box center */
  #gV,#gA,#gMid{ transform-box:fill-box; transform-origin:center; }

  /* START state = "VA" monogram: V & A enlarged and pulled to the centre,
     middle letters hidden. */
  #gV{ transform:translateX(310px) scale(1.55); }
  #gA{ transform:translateX(-310px) scale(1.55); }
  #gMid{ opacity:0; transform:scale(.94); }

  /* transitions (run in both directions for replay) */
  #gV,#gA{ transition:transform 1.5s cubic-bezier(.66,0,.2,1) .55s; }
  #gMid{ transition:opacity 1s ease 1.15s, transform 1.25s cubic-bezier(.66,0,.2,1) 1.15s; }

  /* END state = full wordmark */
  #mark.go #gV{ transform:none; }
  #mark.go #gA{ transform:none; }
  #mark.go #gMid{ opacity:1; transform:none; }

  .hint{
    position:fixed;
    bottom:26px;left:0;right:0;
    text-align:center;
    color:var(--cream);
    font:300 12px/1 system-ui,sans-serif;
    letter-spacing:.22em;
    text-transform:uppercase;
    opacity:.45;
    transition:opacity .4s;
  }
  body:hover .hint{opacity:.7}
</style>
</head>
<body>

  <svg id="mark" viewBox="0 0 780.11 86.21" xmlns="http://www.w3.org/2000/svg" aria-label="Vitalma">
    <!-- V (start letter, dot above) -->

      <circle cx="44.85" cy="10.4" r="10"/>

    <!-- I T A L M  (middle letters, revealed) -->

    </g>

    <!-- A (end letter, dot below) -->
    <g id="gA">
      <path d="M772.95,86.21h0c-2.63,0-5.05-1.44-6.29-3.75-8.53-15.9-22.45-47.24-31.41-65.66h-.33c-9.25,18.4-22.89,49.5-31.13,65.56-1.21,2.37-3.66,3.85-6.32,3.85h0c-5.21,0-8.65-5.41-6.43-10.13l32.1-68.42C725.34,2.98,730.04,0,735.2,0h0c5.16,0,9.85,2.98,12.05,7.65l32.17,68.37c2.23,4.74-1.23,10.19-6.47,10.19Z"/>
      <circle cx="735.25" cy="76.21" r="10"/>
    </g>
  </svg>

  <div class="hint">Klikněte pro přehrání</div>

<script>
  var mark=document.getElementById('mark');
  function play(){
    mark.classList.remove('go');
    void mark.offsetWidth;            // force reflow → restart transition
    setTimeout(function(){mark.classList.add('go');},60);
  }
  window.addEventListener('load',function(){ setTimeout(function(){mark.classList.add('go');},550); });
  document.body.addEventListener('click',play);
</script>
</body>
</html>
