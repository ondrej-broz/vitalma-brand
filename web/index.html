<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitalma</title>
<style>
  :root{
    --green:#4a7a4a;
    --cream:#f5edd8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--cream)}

  /* fixed full-screen viewport holds both colour versions */
  .viewport{position:fixed;inset:0;overflow:hidden;z-index:0}
  .layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .layer.reverse{background:var(--cream)}                                   /* green logo on cream */
  .layer.hero{background:var(--green);clip-path:inset(0 0 0 0);will-change:clip-path}  /* cream logo on green */

  /* a real, in-flow element that creates the scroll distance */
  .spacer{position:relative;z-index:1;height:240vh;pointer-events:none}

  .wmark{width:min(760px,92vw);height:auto;overflow:visible;display:block}
  .reverse .wmark path,.reverse .wmark rect,.reverse .wmark circle{fill:var(--green)}
  .hero    .wmark path,.hero    .wmark rect,.hero    .wmark circle{fill:var(--cream)}

  /* ---- intro animation lives on the hero layer ---- */
  #bmV,#bmA{ transform-origin:0 0; }
  #bmV{ transform:matrix(0.42,0,0,0.42,155.04,-82.46); }
  #bmA{ transform:matrix(0.42,0,0,0.42,155.04,-82.46); }
  #bmLayer{ opacity:1; }
  #loVA{ opacity:0; }
  #loMid{ opacity:0; }
  #bmV,#bmA{ transition:transform 1.6s cubic-bezier(.66,0,.2,1) .6s; }
  #bmLayer{ transition:opacity .5s ease 2.05s; }
  #loVA{ transition:opacity .5s ease 2.05s; }
  #loMid{ transition:opacity .85s ease 1.3s; }
  #intro.go #bmV{ transform:matrix(0.1443,0,0,0.1443,0,0); }
  #intro.go #bmA{ transform:matrix(0.1443,0,0,0.1443,618.657,0); }
  #intro.go #bmLayer{ opacity:0; }
  #intro.go #loVA{ opacity:1; }
  #intro.go #loMid{ opacity:1; }

  .cue{
    position:fixed;bottom:28px;left:0;right:0;text-align:center;z-index:2;
    color:var(--cream);font:300 12px/1 system-ui,sans-serif;
    letter-spacing:.24em;text-transform:uppercase;opacity:.55;pointer-events:none;
    mix-blend-mode:difference;
  }
  .cue .arrow{display:block;font-size:18px;margin-top:8px;animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
</style>
</head>

<script>
  var intro=document.getElementById('intro');
  window.addEventListener('load',function(){ setTimeout(function(){intro.classList.add('go');},650); });

  var hero=document.getElementById('heroLayer'), cue=document.getElementById('cue'), ticking=false;
  function apply(){
    ticking=false;
    var max=document.documentElement.scrollHeight-window.innerHeight;
    var y=window.scrollY||window.pageYOffset||document.documentElement.scrollTop||0;
    var p=max>0?Math.min(1,Math.max(0,y/max)):0;
    hero.style.clipPath='inset(0 0 '+(p*100).toFixed(2)+'% 0)';
    cue.style.opacity=Math.max(0,0.55-p*1.4);
  }
  function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(apply); } }
  addEventListener('scroll',onScroll,{passive:true});
  addEventListener('resize',apply);
  apply();
</script>
