<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitalma — názvy</title>
<style>
  :root{ --green:#4a7a4a; --cream:#f5edd8; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--green);display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden}
  .stage{position:relative;width:min(80vw,880px);height:54vh;min-height:260px;
    display:flex;align-items:center;justify-content:center}

  /* every layer centred and HIDDEN until it is its turn (no overlap, ever) */
  #intro,.glyph{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    fill:var(--cream);display:block;visibility:hidden}
  #intro.show,.glyph.show{visibility:visible}
  .glyph path,.glyph rect,.glyph circle,
  #intro path,#intro rect,#intro circle{fill:var(--cream)}

  /* cap-heights matched: intro viewBox is 320 tall (caps 86) ⇒ 3.72× word height */
  #intro{height:min(50vh,320px);width:auto}
  .word{height:min(13.44vh,86px);width:auto}

  /* ===== VITALMA: brandmark opens into wordmark (original hero animation) ===== */
  #intro{clip-path:inset(0 0 0 0);transition:clip-path .6s cubic-bezier(.65,0,.2,1)}
  #intro.out{clip-path:inset(0 0 0 100%)}            /* wipe VITALMA away L→R */
  #bmV,#bmA{transform-origin:0 0}
  #bmV{transform:matrix(0.42,0,0,0.42,155.04,-82.46)}
  #bmA{transform:matrix(0.42,0,0,0.42,155.04,-82.46)}
  #bmLayer{opacity:1} #loVA{opacity:0} #loMid{opacity:0}
  #bmV,#bmA{transition:transform 1.6s cubic-bezier(.66,0,.2,1) .6s}
  #bmLayer{transition:opacity .45s ease 2.0s}
  #loVA{transition:opacity .45s ease 2.0s}
  #loMid{transition:opacity .8s ease 1.35s}
  #intro.go #bmV{transform:matrix(0.1443,0,0,0.1443,0,0)}
  #intro.go #bmA{transform:matrix(0.1443,0,0,0.1443,618.657,0)}
  #intro.go #bmLayer{opacity:0}
  #intro.go #loVA{opacity:1}
  #intro.go #loMid{opacity:1}
  #intro.snap *{transition:none!important}
  #intro.snap{transition:none!important}

  /* ===== other names: clean draw wipe, one at a time ===== */
  .glyph{clip-path:inset(0 100% 0 0);transition:clip-path var(--dur,.9s) cubic-bezier(.65,0,.2,1)}
  .glyph.draw{clip-path:inset(0 0 0 0)}
  .glyph.wipe{clip-path:inset(0 0 0 100%)}
  .glyph.snap{transition:none!important}
</style>
</head>

<script>
  var intro=document.getElementById('intro');
  var words=[].slice.call(document.querySelectorAll('.word'));
  function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
  function reflow(el){void el.offsetWidth}

  function hideAll(){
    intro.classList.remove('show','go','out');
    words.forEach(function(w){ w.classList.remove('show','draw','wipe'); });
  }

  async function brandmarkBeat(holdMs){
    hideAll();
    intro.classList.add('snap');          /* no transitions while we reset */
    intro.classList.remove('go','out');   /* => brandmark state */
    intro.style.clipPath='inset(0 0 0 0)';
    intro.classList.add('show');
    reflow(intro);
    intro.classList.remove('snap');
    await wait(holdMs);                    /* hold the brandmark */
  }

  async function openVitalma(){
    intro.classList.add('go');             /* brandmark opens ≈2.6s */
    await wait(2600 + 1100);               /* open + hold full word */
    intro.style.clipPath='';               /* let class drive it */
    intro.classList.add('out');            /* wipe VITALMA away */
    await wait(620);
    intro.classList.remove('show');        /* gone */
  }

  async function drawName(w){
    w.classList.add('snap');               /* reset hidden, no transition */
    w.classList.remove('draw','wipe');
    w.classList.add('show');
    reflow(w);
    w.classList.remove('snap');
    w.style.setProperty('--dur','900ms');
    w.classList.add('draw');               /* draw L→R */
    await wait(900 + 1050);
    w.style.setProperty('--dur','620ms');
    w.classList.add('wipe');               /* erase L→R */
    await wait(640);
    w.classList.remove('show','draw','wipe');
  }

  async function loop(){
    while(true){
      await brandmarkBeat(750);            /* ◀ start & END of every cycle: brandmark */
      await openVitalma();                 /* VITALMA grows out of it */
      for(var i=0;i<words.length;i++) await drawName(words[i]);  /* the other 3 */
    }
  }
  loop();
</script>
