<title>Vitalma — názvy</title>
<style>
  :root{ --green:#4a7a4a; --cream:#f5edd8; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--green);display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden}

  .stage{position:relative;width:min(78vw,860px);height:46vh;min-height:240px;
    display:flex;align-items:center;justify-content:center}

  .glyph{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    fill:var(--cream);display:block}
  .glyph path,.glyph rect,.glyph circle{fill:var(--cream)}

  /* the mark is a symbol — a touch taller; words share one cap-height */
  .mark{height:min(34vh,210px);width:auto}
  .word{height:min(13.5vh,86px);width:auto}

  /* drawing wipe: hidden -> revealed left→right -> erased left→right */
  .glyph{clip-path:inset(0 100% 0 0);transition:clip-path var(--dur,.85s) cubic-bezier(.65,0,.2,1)}
  .glyph.draw{clip-path:inset(0 0 0 0)}      /* fully drawn */
  .glyph.wipe{clip-path:inset(0 0 0 100%)}   /* erased to the left */
</style>
</head>

<script>
  var stage=document.getElementById('stage');
  var seq=[
    {el:stage.querySelector('.mark'), hold:700,  draw:850, erase:600},
    {el:stage.querySelector('[aria-label=VITALMA]'),  hold:1000, draw:900, erase:600},
    {el:stage.querySelector('[aria-label=VITALIA]'),  hold:1000, draw:900, erase:600},
    {el:stage.querySelector('[aria-label=VITALIE]'),  hold:1000, draw:900, erase:600},
    {el:stage.querySelector('[aria-label=ALTEVITA]'), hold:1000, draw:900, erase:600}
  ];

  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

  async function play(){
    while(true){
      for(var i=0;i<seq.length;i++){
        var s=seq[i], el=s.el;
        el.style.setProperty('--dur', s.draw+'ms');
        el.classList.remove('wipe'); el.classList.add('draw');  /* draw L→R */
        await wait(s.draw + s.hold);
        el.style.setProperty('--dur', s.erase+'ms');
        el.classList.add('wipe');                               /* erase L→R */
        await wait(s.erase);
        el.classList.remove('draw','wipe');                     /* reset hidden */
        await wait(40);
      }
    }
  }
  play();
</script>
